name: Deploy portfolio to VPS

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Register a GitHub Actions runner inside your VPC with the label "vpc".
    runs-on: [self-hosted, linux, x64, vpc]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload site to Nginx document root
        env:
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          test -n "$VPS_DEPLOY_PATH"
          mkdir -p "$VPS_DEPLOY_PATH"
          rsync -az --delete frontend/dist/ "$VPS_DEPLOY_PATH/"
